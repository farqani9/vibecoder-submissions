# Filled in by the Submit page (submit.html) through URL query parameters keyed by each field's id.
name: Submit a skill
description: Suggest an agent skill for the vibecoder directory. The site's Submit page fills this in for you.
title: "Add skill: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a skill. Every entry is checked by hand before it's listed: the repo must contain a SKILL.md, still be maintained, and be a skill rather than a list of links.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: GitHub link to the skill.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Skill name
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      description: One of the directory's sections, or a new one to suggest.
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: One line, about 47 characters, in your own words.
    validations:
      required: true
  - type: textarea
    id: entry
    attributes:
      label: data.js entry
      description: Generated by the Submit page. Maintainers paste this line into SKILLS in js/data.js after review.
      render: js
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything reviewers should know (tested agents, install quirks, lookup problems).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The repo contains at least one SKILL.md.
          required: true
